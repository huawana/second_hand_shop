spring.web.resources.add-mappings=true
spring.application.name=second-hand-shop

# ---------------------------------------------------------------------------
# 数据源
# 【工程化改造】账号密码支持环境变量覆盖（${VAR:默认值} 语法）：
#   Windows:  set DB_PASSWORD=xxx && mvn spring-boot:run
#   Linux  :  export DB_PASSWORD=xxx && ./mvnw spring-boot:run
# 这样生产环境不再需要把密码写进代码/配置文件（Phase 1 会进一步移到 Nacos/配置中心）。
# 注意：默认值 root/root 仅用于本地开发，生产部署必须通过环境变量覆盖。
# ---------------------------------------------------------------------------
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:shop}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# ---------------------------------------------------------------------------
# MyBatis
# ---------------------------------------------------------------------------
mybatis.mapper-locations=classpath:mapper/*.xml
#打开驼峰命名规则
mybatis.configuration.map-underscore-to-camel-case=true
# 打印 SQL，开发期排查慢查询/参数问题非常有用（生产环境请调成 NoLoggingImpl）
mybatis.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl

# ---------------------------------------------------------------------------
# 文件上传
# 【Bug 修复】原值指向 E:/java/springboot3/second_hand_shop/...，本机不存在该目录，
# 任何上传商品/修改图片的操作都会抛 RuntimeException。改为相对项目根目录。
# 注意：运行时写入 src/main/resources 仍不是最佳实践（会被重新编译覆盖），
# Phase 1 将改为外部目录 + WebMvcConfig 资源映射。
# ---------------------------------------------------------------------------
upload.path=./src/main/resources/static/shop/assets/product-img/

# 上传大小限制（默认单文件 1MB，商品图经常超）
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# ---------------------------------------------------------------------------
# 服务端
# ---------------------------------------------------------------------------
server.servlet.session.timeout=86400
