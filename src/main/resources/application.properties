spring.web.resources.add-mappings=true
spring.application.name=second-hand-shop

# ---------------------------------------------------------------------------
# 数据源
# 【工程化改造】账号密码支持环境变量覆盖（${VAR:默认值} 语法）：
#   Windows:  set DB_PASSWORD=xxx && mvn spring-boot:run
#   Linux  :  export DB_PASSWORD=xxx && ./mvnw spring-boot:run
# 这样生产环境不再需要把密码写进代码/配置文件（Phase 1 会进一步移到 Nacos/配置中心）。
# 注意：默认值 root/root 仅用于本地开发，生产部署必须通过环境变量覆盖。
# ---------------------------------------------------------------------------
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:shop}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# ---------------------------------------------------------------------------
# MyBatis
# ---------------------------------------------------------------------------
# 【Phase 2】前缀由 mybatis.* 改为 mybatis-plus.*：
# MyBatis-Plus 的配置类绑定的是 mybatis-plus 前缀，原 mybatis.* 不再生效。
# 命令行传参也要跟着改：--mybatis-plus.configuration.log-impl=...
# ---------------------------------------------------------------------------
# 库存扣减策略（Phase 2.4）
#   optimistic  = 乐观锁：读版本 → 带版本条件 UPDATE → 冲突则重试（默认，冲突少时更优）
#   pessimistic = 悲观锁：SELECT ... FOR UPDATE 先锁行 → 一次成功，不重试（冲突多时会排队）
# 切换只改这一行，业务代码零改动（策略模式 + @ConditionalOnProperty）。
# max-retry 是乐观锁的重试上限：不是越大越好 —— 冲突激烈时重试会放大数据库压力。
# ---------------------------------------------------------------------------
shop.stock.strategy=optimistic
shop.stock.max-retry=3

mybatis-plus.mapper-locations=classpath:mapper/*.xml
#打开驼峰命名规则
mybatis-plus.configuration.map-underscore-to-camel-case=true
# 打印 SQL，开发期排查慢查询/参数问题非常有用（生产环境请调成 NoLoggingImpl）
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl

# ---------------------------------------------------------------------------
# 文件上传（由自定义 starter `oss-spring-boot-starter` 自动配置接管）
# 【Bug 修复】原 upload.path 指向 E:/java/springboot3/...，本机不存在该目录，
# 任何上传商品/修改图片的操作都会抛 RuntimeException。现在改为相对项目根目录。
# 【Phase 1 收尾】配置从 upload.path 迁移到 oss.*：
#   业务代码不再自己拼路径、自己建目录，只注入 FileStorage 并拿回一个可访问的 URL。
#   将来换对象存储（MinIO/OSS）只需改 oss.type 与对应参数，业务代码零改动。
# 注意：默认目录仍在 src/main/resources 下（运行时写源码目录会被重新编译覆盖），
# 生产应指向外部目录，并用 WebMvcConfig 把 oss.url-prefix 映射到文件系统 —— 见 Phase 10。
# ---------------------------------------------------------------------------
oss.type=local
oss.local-dir=./src/main/resources/static/shop/assets/product-img/
oss.url-prefix=/shop/assets/product-img/

# 上传大小限制（默认单文件 1MB，商品图经常超）
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# ---------------------------------------------------------------------------
# 服务端
# ---------------------------------------------------------------------------
server.servlet.session.timeout=86400

# ---------------------------------------------------------------------------
# JWT（Phase 1）
# 【设计说明】认证凭证走「HttpOnly + SameSite=Lax 的 Cookie」而不是 localStorage：
#   1) HttpOnly  → JS 读不到，XSS 也偷不走 token（localStorage 方案的最大风险）
#   2) SameSite  → 跨站请求不携带 Cookie，从源头阻断 CSRF 的第一道防线
#   3) 页面跳转（<a href> / 表单提交）无法手动带 Authorization 头，
#      而 Cookie 由浏览器自动携带，所以本项目这种「服务端渲染 + 表单」架构必须用 Cookie
# 同时 Spring Security 的 CSRF 防护保持开启（纵深防御），见 SecurityConfig。
# ---------------------------------------------------------------------------
# 生产环境必须用环境变量覆盖：HS256 要求密钥 >= 256 bit（32 字节）
jwt.secret=${JWT_SECRET:second-hand-shop-dev-secret-key-change-me-in-production-2026}
# access token 寿命。刻意做得短：无状态令牌签发后无法撤回，
# 「短寿命」是把它被滥用的时间窗压到最小的主要手段，配合 refresh token 换续期。
jwt.expire-minutes=30
# refresh token 寿命（天）。它可被即时吊销（存 Redis），所以可以长一些。
jwt.refresh-expire-days=7
jwt.cookie-name=ACCESS_TOKEN
jwt.refresh-cookie-name=REFRESH_TOKEN
# 仅 HTTPS 下发送（本地 http 必须为 false，生产置 true）
jwt.cookie-secure=false

# ---------------------------------------------------------------------------
# Redis（Phase 1 收尾：access token 黑名单 + refresh token 存储）
# 【为什么要单独配置 database】同机可能还有别的项目在用 Redis，
# 统一用 db 3 并配合 shop: 前缀，避免 key 串味（ROADMAP 的运维风险清单里也提过）。
# key 布局见 shop.security.RedisTokenStore。
# ---------------------------------------------------------------------------
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=${REDIS_DB:3}
spring.data.redis.timeout=2s
# 说明：没有配置 lettuce 连接池。Lettuce 默认复用单条线程安全连接（多路复用），
# 对本项目这种「每个请求最多查一次黑名单」的访问量完全够用，也少一个 commons-pool2 依赖。
# 等 Phase 4 压测发现 Redis 成为瓶颈时，再加 commons-pool2 并显式配置池参数 —— 到那时
# 才有真实数据决定 max-active 该填多少，现在填数字只是猜。
