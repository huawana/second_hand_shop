spring.web.resources.add-mappings=true

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/shop
spring.datasource.username=root
spring.datasource.password=root

mybatis.mapper-locations=classpath:mapper/*.xml
#打开驼峰命名规则
mybatis.configuration.map-underscore-to-camel-case=true

# 【Bug 修复】原值指向 E:/java/springboot3/second_hand_shop/...，本机不存在该目录，
# 任何上传商品/修改图片的操作都会抛 RuntimeException。改为相对项目根目录。
# 注意：运行时写入 src/main/resources 仍不是最佳实践（会被重新编译覆盖），
# Phase 1 将改为外部目录 + WebMvcConfig 资源映射。
upload.path=./src/main/resources/static/shop/assets/product-img/

# 上传大小限制（默认单文件 1MB，商品图经常超）
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

server.servlet.session.timeout=86400