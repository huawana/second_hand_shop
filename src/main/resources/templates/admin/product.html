<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商城后台管理系统</title>
  <link rel="stylesheet" type="text/css" href="/admin/assets/css/common.css">
</head>
<body>
  <div class="container">
    <!-- 侧边栏 -->
    <div class="sidebar">
      <div class="logo">电子商城</div>
      <hr>
      <div class="menu">
        <ul>
          <li id="admin">
            <a href="/admin/admin">
              <img src="/admin/assets/img/admin1.png">
              <label>控制台</label>
            </a>
          </li>
          <li id="user">
            <a href="/admin/user">
              <img src="/admin/assets/img/user1.png">
              <label>用户管理</label>
            </a>
          </li>
          <li id="product">
            <a href="/admin/product">
              <img src="/admin/assets/img/product1.png">
              <label>商品管理</label>
            </a>
          </li>
          <li id="order">
            <a href="/admin/order">
              <img src="/admin/assets/img/order1.png">
              <label>订单管理</label>
            </a>
          </li>
        </ul>
      </div>
    </div>
    <!-- 主内容区 -->
    <div class="main">
      <!-- 导航条 -->
        <div class="nav">
          <div class="nav_brand">控制台</div>
            <div class="nav_bar">
              <ul >
                <li id="useritem">
                  <img src="assets/img/user1.png">
                  <ul id="drop_menu">
                    <li><a href="/admin/admin_edit">编辑</a></li>
                    <li><a href="/admin/logout">退出</a></li>
                  </ul>
                </li>
              </ul>
            </div>
        </div>
        <!-- 内容区 -->
        <div class="content">
          <div class="table_card">
            <div class="table_desc">
              <div class="desc1">所有商品</div>
              <div class="desc2">
                <a href="/admin/product_add">添加商品</a>
              </div>
            </div>

            <div class="table">
              <table>
                <thead>
                  <th>
                    ID
                  </th>
                  <th>
                    商品名
                  </th>
                  <th>
                    卖家昵称
                  </th>
                  <th>
                    价格
                  </th>
                  <th>
                    创建时间
                  </th>
                  <th>
                    商品描述
                  </th>
                  <th>
                    操作
                  </th>
                </thead>
                <tbody>
                  <tr th:each="product:${products}">
                    <td th:text="${product.id}">
                    </td>
                    <td th:text="${product.name}">
                    </td>
                    <td th:text="${product.sellerName}">
                    </td>
                    <td th:text="${product.price}">
                    </td>
                    <td th:text="${product.createdAt}">
                    </td>
                    <td th:text="${product.description}">
                    </td>
                    <td>
                      <a th:href="@{'product_delete/' + ${product.id}}">删除 </a>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
    </div>
  </div>
  
</body>
<script type="text/javascript" src="/admin/assets/JS/common.js"></script>
</html>
