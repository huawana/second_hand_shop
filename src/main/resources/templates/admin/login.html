<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>登录</title>
	<link rel="stylesheet" href="/admin/assets/css/login.css" type="text/css">
<body>
   <div class="main">
   	<div class="card">
   	  	<div class="card_desc">
   	  		<div class="desc1">登录</div>
   	  		<div class="desc2">以管理员身份登录后台</div>
   	  	</div>
   	  	<div class="card_form">
   	  		<form method="post" action="loginResult">
   	  		    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
				<p th:text="${loginError}" class="error"></p>
   	  			<div class="edit1">
	   	  			<p>用户名</p>
	   	  			<input type="text" name="adminuser">
   	  		   </div>
   	  		   <div class="edit1">
	   	  			<p>密码</p>
	   	  			<input type="password" name="adminpass">
   	  		   </div>
   	  		   <input class="button" type="submit" name="submit" value="登录">
   	  		</form>   	  		
   	  	</div>
   	</div>
   </div>	
</body>
</html>
