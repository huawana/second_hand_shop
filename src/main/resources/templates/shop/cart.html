<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
  <link rel="stylesheet" type="text/css" href="/shop/assets/css/header.css">
  <link rel="stylesheet" type="text/css" href="/shop/assets/css/cart.css">
  <link rel="stylesheet" type="text/css" href="/shop/assets/css/common.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
<header>
  <div class="logo">
    <img src="/shop/assets/HTML-img/logo.png" alt="">
  </div>
  <div class="position">
    <a href="/shop/city"><img src="/shop/assets/HTML-img/location.png" alt=""></a>
    <ul>
      <li th:text="${province}"></li>
      <li th:text="${city}"></li>
      <li th:text="${area}"></li>
    </ul>
  </div>
  <div class="school">
    <a href="/shop/school"><img src="/shop/assets/HTML-img/school.png" alt=""></a>
    <ul>
      <li th:text="${school}"></li>
    </ul>
  </div>
  <ul class="navigation">
    <li><a href="/shop/index">首页</a></li>
    <li><a href="/shop/index/sortedByTime">最近发布</a></li>
    <li><a href="/shop/index/chosenByLocation">同城优选</a></li>
    <li><a href="/shop/index/chosenBySchool">校内交易</a></li>
    <li><a href="/shop/sale">发布商品</a></li>

  </ul>
  <ul class="person">
    <li>
      <a href="/shop/person">
        <img id="user-img" src="/shop/assets/HTML-img/user1.png" alt="">
      </a>
    </li>
    <li>
      <p th:text="'您好！' + ${shopusername}"></p>
    </li>
    <li>
      <a href="/shop/cart">
        <img id="cart-img" src="/shop/assets/HTML-img/cart1.png" alt="">
      </a>
    </li>
    <li>
      <a href="/shop/exit">
        <img id="exit-img" src="/shop/assets/HTML-img/exit.png" alt="">
      </a>
    </li>
  </ul>
  <div class="search">
    <form action="/shop/search" method="post">
      <div class="input"></div>
    </form>
  </div>
</header>
<div class="divider"></div>
  <main>
    <div class="content">
      <div class="table_card">
        <div class="table">
          <table>
            <thead>
            <th>
              图片
            </th>
            <th>
              商品名
            </th>
            <th>
              商品价格
            </th>
            <th>
              操作
            </th>
            </thead>
            <tbody>
            <tr th:each="product:${cartProduct}">
              <td>
                <img th:src="${product.imgPath}" alt="">
              </td>
              <td th:text="${product.name}" class="productName">
              </td>
              <td th:text="${product.price}">
              </td>
              <td>
                <a class="delete_product" th:data-productid="${product.id}" href="#">删除</a>
                <a class="buy_product" th:data-productid="${product.id}" href="#">购买</a>
              </td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
<script src="/shop/assets/JS/cart.js"></script>
</body>
